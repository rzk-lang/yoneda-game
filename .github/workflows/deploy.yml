name: Deploy

# Build the site with rzk-game-action on pushes and PRs to main, and manual runs.
# Only pushes to main publish public/ to gh-pages for GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # for peaceiris/actions-gh-pages to push to gh-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🎮 Bundle and assemble the site
        uses: rzk-lang/rzk-game-action@v1
        with:
          game: game/game.yaml
          engine-version: v0.6.1

      - name: 🚀 Deploy to GitHub Pages (gh-pages)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
